[build.environment]
  VITE_SURVEY_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyk_dABcmrj6-UYFwGV7gRl-nKRqp1MJBoCMlAinsSNl-kDgkC-v6a8HEAy8oiDNvxgUQ/exec"

[build]
  command = "npm run build"
  publish = "dist"

# Headers for proper content serving
[[headers]]
  for = "/*.html"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200